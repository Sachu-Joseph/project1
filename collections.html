<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collections | Urban Cart</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
     <div id="particles-js"></div>

  <header id="header">
    <div class="container nav-container">
      <a href="index.html" class="logo">Urban Cart</a>
      <nav>
        <button class="menu-toggle" aria-label="Menu">Menu</button>
        <ul class="nav-menu" id="nav-menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="collections.html">Collections</a></li>
          <li><a href="how-to-order.html">How to Order</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <!-- Same header -->
  <div class="container" style="padding-top:120px;text-align:center;">
    <h1 style="font-size:3.8rem;margin-bottom:60px;background:linear-gradient(90deg,#333,#a8b5a2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Featured Collections</h1>
    <div class="collections-grid">
      <div class="col-card"><img src="https://images.unsplash.com/photo-1594223273488-8b6c8d2501c9?ixlib=rb-4.0.3&auto=format&fit=crop&q=80" alt=""><div class="overlay"><h3>Tops</h3></div></div>
      <div class="col-card"><img src="https://images.unsplash.com/photo-1604176354204-9268737828e4?ixlib=rb-4.0.3&auto=format&fit=crop&q=80" alt=""><div class="overlay"><h3>Accessories</h3></div></div>
      <div class="col-card"><img src="https://images.unsplash.com/photo-1541099649105-f69e1b837a49?ixlib=rb-4.0.3&auto=format&fit=crop&q=80" alt=""><div class="overlay"><h3>Bottoms</h3></div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    if (typeof particlesJS === "function") {
      particlesJS("particles-js", {
        particles: {
          number: { value: 40 },
          color: { value: ["#a8b5a2", "#ffe5d9"] },
          opacity: { value: 0.5 },
          size: { value: 3 },
          move: { speed: 0.7 }
        }
      });
    }

    const menuToggle = document.querySelector(".menu-toggle");
    const navMenu = document.getElementById("nav-menu");
    if (menuToggle && navMenu) {
      menuToggle.addEventListener("click", () => navMenu.classList.toggle("active"));
    }

    window.addEventListener("scroll", () => {
      document.getElementById("header").classList.toggle("scrolled", window.scrollY > 50);
    });
  </script>
</body>
</html>
