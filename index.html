<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urban Cart | Trendy Fashion For Every Mood</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="/styles.css">
</head>

<body>

  <div id="particles-js"></div>

  <header id="header">
    <div class="container nav-container">
      <a href="/" class="logo">Urban Cart</a>
      <button class="menu-toggle">☰</button>
      <ul class="nav-menu" id="nav-menu">
        <li><a href="/">Home</a></li>
        <li><a href="/shop.html">Shop</a></li>
        <li><a href="/collections.html">Collections</a></li>
        <li><a href="/contact.html">Contact</a></li>
      </ul>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Trendy Fashion<br>For Every Mood</h1>
      <p>Curated minimal aesthetic pieces that speak your vibe.</p>

      <p id="backend-message">Connecting to server...</p>

      <div>
        <a href="https://wa.me/919876543210" class="btn btn-primary">WhatsApp Shop Now</a>
        <a href="https://instagram.com/yourstore" class="btn btn-outline">Instagram DM</a>
      </div>
    </div>
  </section>

  <footer>
    <p>© 2025 Urban Cart • Made with love</p>
  </footer>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

  <!-- Backend Connection -->
  <script>
  fetch("/api/message")
    .then(res => res.json())
    .then(data => {
      document.getElementById("backend-message").innerText = data.message;
    })
    .catch(() => {
      document.getElementById("backend-message").innerText = "Backend not connected";
    });
</script>

<script>
    particlesJS("particles-js",{
      particles:{
        number:{value:80},
        color:{value:["#a8b5a2","#ffe5d9"]},
        size:{value:4},
        move:{speed:0.7}
      }
    });

    window.addEventListener("scroll",()=>{
      document.getElementById("header").classList.toggle("scrolled",window.scrollY>50);
    });

    document.querySelector(".menu-toggle").onclick=()=>{
      document.getElementById("nav-menu").classList.toggle("active");
    };
  </script>

</body>
</html>
